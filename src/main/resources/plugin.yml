name: ServerCoreX
version: '1.0-SNAPSHOT'
main: de.main.serverCoreX.ServerCoreX
api-version: '1.21'
depend: [PlaceholderAPI, ProtocolLib, LuckPerms]
softdepend:
  - Vault
commands:
  fly:
    usage: fly
    description: "Use it to fly around your Server"

  broadcast:
    usage: broadcast
    description: "Sends an titel to every player"

  gm:
    usage: gm
    description: "Use it to change the gamemode of an player"
    aliases:
      - gamemode
  tpa:
    usage: tpa
    description: "Sends a teleport-request"

  tpyes:
    usage: tpyes
    description: "Accepts a teleport-request"
    aliases:
      - tpaccept

  tp:
    usage: tp
    description: "Teleports instantly"

  tphere:
    usage: tphere
    description: "Sends a teleport-here-request"

  discord:
    usage: discord
    description: "Sends the Discord-Invite"
    aliases:
      - dc

  spawn:
    usage: spawn
    description: "Teleports to spawn"

  setspawn:
    usage: setspawn
    description: "Sets the spawn"

  delspawn:
    usage: delspawn
    description: "Deletes the spawn"

  reload:
    usage: reload
    description: "Reloads the Configuration Files of the plugin"

  setweather:
    usage: setweather
    description: "Sets the weather in the current world"

  settime:
    usage: settime
    description: "Sets the time in the current world"

  clearchat:
    usage: clearchat
    description: "Clears the Chat"
    aliases:
      - cc

  invsee:
    usage: invsee
    description: "Shows an inventory from a player"


  rtp:
    usage: rtp
    description: "Random teleport"
    aliases:
      - farmwelt
      - farm
      - randomteleport

  vanish:
    usage: vanish
    description: "Vanishes a player"
    aliases:
      - v

  size:
    usage: size
    description: "Changes the size of an player"

  eco:
    usage: eco
    description: "Money-System"

  bank:
    usage: bank
    description: "Opens the bank"

  belohnung:
    usage: belohnung
    description: "Claims the 30min reward"

  pay:
    usage: pay
    description: "Use it to pay other player"

  daily:
    usage: daily
    description: "Claims the 24hrs reward"
    aliases:
      - täglichebelohnung

  money:
    usage: money
    description: "Displays money of an player"

  walkspeed:
    usage: walkspeed
    description: "Changes the walk-speed"

  flyspeed:
    usage: flyspeed
    description: "Changes the walk-speed"

  clear:
    usage: clear
    description: "Clears the inventory of a player"


permissions:
  chat.cooldown.bypass:
    default: op
  serverrestart.use:
    default: op
  heal.use:
    default: op
  invsee.use:
    default: op
  invsee.take:
    default: op
  fly.use:
    default: op
  gamemode.use:
    default: op
  gamemode.others:
    default: op
  size.use:
    description: "Erlaubt das verändern der Spieler-Größe"
    default: op
  walkspeed.use:
    description: "Shows player in Vanish"
    default: op
  flyspeed.use:
    description: "Shows player in Vanish"
    default: op
  reload.use:
    description: "Reload"
    default: op
  vanish.bypass:
    description: "Shows player in Vanish"
    default: op
  vanish.see:
    description: "Shows player in Vanish"
    default: op
  clear.use:
    default: op
  eco.use:
    default: op
  money.use:
    default: op