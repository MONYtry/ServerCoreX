name: ServerCoreX
version: '1.0-SNAPSHOT'
main: de.main.serverCoreX.ServerCoreX
api-version: '1.21'
depend: [PlaceholderAPI, ProtocolLib]
softdepend:
  - Vault
commands:
  fly:
    usage: fly
    description: "Use it to fly around your Server"

  gm:
    usage: gm
    description: "Use it to change the gamemode of an player"
    aliases:
      - gamemode
  tpa:
    usage: tpa
    description: "Use it to change the gamemode of an player"

  tpyes:
    usage: tpyes
    description: "Use it to change the gamemode of an player"
    aliases:
      - tpaccept

  tp:
    usage: tp
    description: "Use it to change the gamemode of an player"

  tphere:
    usage: tphere
    description: "Use it to change the gamemode of an player"

  discord:
    usage: discord
    description: "Use it to change the gamemode of an player"
    aliases:
      - dc

  spawn:
    usage: spawn
    description: "Use it to change the gamemode of an player"

  setspawn:
    usage: setspawn
    description: "Setzt den Spawn"

  delspawn:
    usage: delspawn
    description: "Setzt den Spawn"

  reload:
    usage: reload
    description: "Läd das Plugin inkl. Konfiguration neu!"

  setweather:
    usage: setweather
    description: "Ändert das Wetter"

  settime:
    usage: settime
    description: "Setzt die Uhrzeit"

  rtp:
    usage: rtp
    description: "Setzt die Uhrzeit"
    aliases:
      - farmwelt
      - farm
      - randomteleport

  vanish:
    usage: vanish
    description: "Setzt User in den Vanish"
    aliases:
      - v

  size:
    usage: size
    description: "Verändert deine Größe"
  eco:
    usage: eco
    description: "Geld verwaltung!"
  bank:
    usage: bank
    description: "bank"
  belohnung:
    usage: belohnung
    description: "Holt die Belohngung ab"

  daily:
    usage: daily
    description: "Einsammeln von täglicher Belohnung"
    aliases:
      - täglichebelohnung
  walkspeed:
    usage: walkspeed
    description: "Verändert deine Lauf-Geschwindigkeit"

  flyspeed:
    usage: flyspeed
    description: "Verändert deine Lauf-Geschwindigkeit"


permissions:
  serverrestart.use:
    default: op
  heal.use:
    default: op
  fly.use:
    default: op
  gamemode.use:
    default: op
  gamemode.others:
    default: op
  size.use:
    description: "Erlaubt das verändern der Spieler-Größe"
    default: op
  walkspeed.use:
    description: "Shows player in Vanish"
    default: op
  flyspeed.use:
    description: "Shows player in Vanish"
    default: op
  reload.use:
    description: "Reload"
    default: op
  vanish.bypass:
    description: "Shows player in Vanish"
    default: op
  vanish.see:
    description: "Shows player in Vanish"
    default: op